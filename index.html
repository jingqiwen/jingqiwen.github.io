<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 网站标题与简介：由 js/config.js 自动写入（请在 config.js 中修改） -->
  <title>你的姓名 | 个人学术主页</title>
  <meta name="description" content="你的姓名，电子信息工程专业本科生。这里是个人学术主页。" />
  <meta name="author" content="你的姓名" />
  <meta name="theme-color" content="#29b6f6" />
  <!-- 网站图标：由 js/config.js 自动写入 -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <!-- 全站样式 -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 无脚本提示：如果用户浏览器禁用了 JavaScript，则显示下面的提示 -->
  <noscript>
    <div style="position:fixed;inset:0;z-index:9999;background:#f5faff;color:#102a43;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;">
      本网站需要开启 JavaScript 才能显示完整内容，请开启后刷新页面。
    </div>
  </noscript>

  <!-- ================================================================
       顶部导航栏（毛玻璃效果，滚动后自动加深背景）
       ================================================================ -->
  <header class="navbar" id="navbar">
    <div class="container navbar-inner">
      <!-- 左侧品牌区：内容（头像+姓名）由 config.js 渲染 -->
      <a class="brand" href="#home" id="nav-brand" aria-label="返回首页"></a>

      <!-- 桌面端导航链接：由 config.js 渲染 -->
      <nav class="nav-links" id="nav-links" aria-label="主导航"></nav>

      <!-- 右侧操作按钮 -->
      <div class="nav-actions">
        <!-- 明暗主题切换按钮（图标由 main.js 根据当前主题切换） -->
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <svg id="theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg id="theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- 移动端汉堡菜单按钮（桌面端隐藏） -->
        <button class="icon-btn hamburger" id="hamburger" type="button" aria-label="打开导航菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <!-- 移动端下拉菜单：由 config.js 渲染，点击链接后自动收起 -->
    <nav class="mobile-menu" id="mobile-menu" aria-label="移动端导航"></nav>
  </header>

  <main>
    <!-- ================================================================
         首屏 Hero：左侧自我介绍 + 右侧贪吃蛇装饰
         背景：天空蓝柔和星点（three-bg.js 绘制，CDN 失败会自动降级）
         ================================================================ -->
    <section class="hero" id="home">
      <!-- 粒子背景容器：canvas 由 three-bg.js 自动创建并塞进来 -->
      <div class="hero-bg" id="hero-bg" aria-hidden="true">
        <!-- 动态光影层：大光斑 + 光束 + 光尘，营造空气感（CSS 动画） -->
        <div class="light-orb orb-1"></div>
        <div class="light-orb orb-2"></div>
        <div class="light-orb orb-3"></div>
        <div class="light-beam beam-1"></div>
        <div class="light-beam beam-2"></div>
        <div class="light-dust" style="--x:12%;--y:18%;"></div>
        <div class="light-dust" style="--x:78%;--y:26%;"></div>
        <div class="light-dust" style="--x:64%;--y:76%;"></div>
        <div class="light-dust" style="--x:22%;--y:72%;"></div>
      </div>

      <div class="container hero-inner">
        <!-- 左侧：文字介绍（由 config.js 渲染） -->
        <div class="hero-left" id="hero-left"></div>

        <!-- 右侧：贪吃蛇装饰卡片（游戏画布与按钮由 main.js 创建） -->
        <div class="hero-right" id="hero-right"></div>
      </div>

      <!-- 向下滚动提示箭头 -->
      <a class="scroll-hint" href="#about" aria-label="向下滚动查看更多">
        <span class="mouse"><span class="wheel"></span></span>
        <span class="scroll-text">向下滚动</span>
      </a>
    </section>

    <!-- ================================================================
         关于我：个人简介 + 基本信息 + 教育经历时间线
         ================================================================ -->
    <section class="section" id="about">
      <div class="container">
        <!-- 模块通用标题：由 main.js 统一生成 -->
        <div class="section-head" data-head="about"></div>
        <!-- 正文内容：由 config.js 渲染 -->
        <div class="about-body" id="about-body"></div>
      </div>
    </section>

    <!-- ================================================================
         掌握技能：分组技能卡片 + 熟练度进度条
         ================================================================ -->
    <section class="section section-alt" id="skills">
      <div class="container">
        <div class="section-head" data-head="skills"></div>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <!-- ================================================================
         科研经历：竖向时间线
         ================================================================ -->
    <section class="section" id="research">
      <div class="container">
        <div class="section-head" data-head="research"></div>
        <div class="timeline" id="research-list"></div>
      </div>
    </section>

    <!-- ================================================================
         项目展示：分类筛选 + 项目卡片网格
         ================================================================ -->
    <section class="section section-alt" id="projects">
      <div class="container">
        <div class="section-head" data-head="projects"></div>
        <!-- 筛选按钮组：由 config.js 渲染 -->
        <div class="filter-bar" id="project-filters" role="tablist" aria-label="项目分类筛选"></div>
        <!-- 项目卡片网格：由 config.js 渲染 -->
        <div class="project-grid" id="project-grid"></div>
      </div>
    </section>

    <!-- ================================================================
         光影瞬间：照片墙 / 头像更多展示位（点击可放大查看）
         ================================================================ -->
    <section class="section" id="gallery">
      <div class="container">
        <div class="section-head" data-head="gallery"></div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>

    <!-- ================================================================
         联系我：社交链接卡片
         ================================================================ -->
    <section class="section section-alt" id="contact">
      <div class="container">
        <div class="section-head" data-head="contact"></div>
        <div class="contact-grid" id="contact-grid"></div>
      </div>
    </section>
  </main>

  <!-- ================================================================
       页脚：访问量统计 + 版权 + ICP 备案号
       ================================================================ -->
  <footer class="footer">
    <div class="container footer-inner">
      <!-- 不蒜子访问量统计：脚本加载成功后会自动填充数字 -->
      <div class="site-stats">
        <span id="busuanzi_container_site_pv" style="display:none;">
          本站总访问量 <span id="busuanzi_value_site_pv">0</span> 次
        </span>
        <span class="stat-divider" aria-hidden="true">·</span>
        <span id="busuanzi_container_site_uv" style="display:none;">
          访客数 <span id="busuanzi_value_site_uv">0</span> 人
        </span>
        <span id="stat-fallback" style="display:none;">访问统计加载中…</span>
      </div>

      <!-- 版权与备案信息：由 config.js 渲染 -->
      <p class="copyright" id="footer-copyright"></p>
      <p class="icp" id="footer-icp"></p>
    </div>
  </footer>

  <!-- 照片灯箱：点击照片后显示大图 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片预览" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览">×</button>
    <button class="lightbox-prev" id="lightbox-prev" type="button" aria-label="上一张">‹</button>
    <figure class="lightbox-body">
      <img id="lightbox-img" src="" alt="" />
      <figcaption>
        <span class="lightbox-title" id="lightbox-title"></span>
        <span class="lightbox-desc" id="lightbox-desc"></span>
      </figcaption>
    </figure>
    <button class="lightbox-next" id="lightbox-next" type="button" aria-label="下一张">›</button>
  </div>

  <!-- 轻提示气泡：复制邮箱/QQ 成功后显示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 回到顶部悬浮按钮 -->
  <button class="back-top" id="back-top" type="button" aria-label="回到顶部">↑</button>

  <!-- ================================================================
       脚本加载顺序（重要，不要改变顺序）：
       1. Three.js CDN：为粒子背景提供 3D 能力（加载失败会自动降级为 2D 星空）
       2. config.js：全站内容配置
       3. three-bg.js：天空柔和星点背景
       4. main.js：页面渲染与全部交互逻辑
       ================================================================ -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/three-bg.js"></script>
  <script defer src="js/main.js"></script>

  <!-- 不蒜子访问量统计脚本（在 config.js 中把 statsEnabled 设为 false 可不显示） -->
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
