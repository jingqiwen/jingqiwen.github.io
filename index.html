<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 网站标题与简介：由 js/config.js 自动写入（请在 config.js 中修改） -->
  <title>温景淇 | 个人学术主页</title>
  <meta name="description" content="温景淇，电子信息工程专业本科生。这里是个人学术主页。" />
  <meta name="author" content="温景淇" />
  <!-- 初始即为深色星空主题，避免刷新时闪一下亮色 -->
  <meta name="theme-color" content="#081426" />
  <!-- 网站图标：由 js/config.js 自动写入 -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <!-- 全站样式 -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 无脚本提示：如果用户浏览器禁用了 JavaScript，则显示下面的提示 -->
  <noscript>
    <div style="position:fixed;inset:0;z-index:9999;background:#081426;color:#e6f4ff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;">
      本网站需要开启 JavaScript 才能显示完整内容，请开启后刷新页面。
    </div>
  </noscript>

  <!-- ================================================================
       顶部导航栏（毛玻璃效果，滚动后自动加深背景）
       ================================================================ -->
  <header class="navbar" id="navbar">
    <div class="container navbar-inner">
      <!-- 左侧品牌区：内容（头像+姓名）由 config.js 渲染 -->
      <a class="brand" href="#home" id="nav-brand" aria-label="返回首页"></a>

      <!-- 桌面端导航链接：由 config.js 渲染（只显示 bar:true 的条目） -->
      <nav class="nav-links" id="nav-links" aria-label="主导航"></nav>

      <!-- 右侧操作按钮 -->
      <div class="nav-actions">
        <!-- 主题切换指路牌：放在按钮左边，箭头指向切换按钮 -->
        <span class="theme-sign" aria-hidden="true">
          <span class="theme-sign-arrow">➜</span>
          <span class="theme-sign-text">点击切换明暗</span>
        </span>

        <!-- 明暗主题切换按钮（图标由 main.js 根据当前主题切换） -->
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <svg id="theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg id="theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- 移动端汉堡菜单按钮（桌面端隐藏） -->
        <button class="icon-btn hamburger" id="hamburger" type="button" aria-label="打开导航菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <!-- 移动端下拉菜单：由 config.js 渲染，点击链接后自动收起 -->
    <nav class="mobile-menu" id="mobile-menu" aria-label="移动端导航"></nav>
  </header>

  <!-- ================================================================
       全站星空层（暗色主题）：固定在视口最底层，覆盖首页和所有版块。
       three-bg.js 把 canvas 画到这里：鼠标静止时星星自动流动/闪烁，
       鼠标（地球光标）移动时整片星空跟随视角变化。
       ================================================================ -->
  <div class="star-field" id="star-field" aria-hidden="true"></div>

  <!-- ================================================================
       亮色主题“宇宙 → 天空 → 大地”场景层（sky-scene.js 绘制）：
       随滚动高度出现火箭/卫星/飞机/无人机/热气球/树木/智能设备等，
       同样跟随鼠标移动；鼠标移出网页后所有物体回到原位。
       ================================================================ -->
  <div class="sky-scene" id="sky-scene" aria-hidden="true"></div>

  <!-- ================================================================
       左侧“银河目录”跳转栏：固定悬浮按钮 + 可展开面板
       每个版块跳转按钮前都有金星/狮子座/火星/土星等天体图标
       ================================================================ -->
  <button class="toc-toggle" id="toc-toggle" type="button" aria-label="打开银河目录" aria-expanded="false">
    <span class="toc-toggle-icon">🪐</span>
    <span class="toc-toggle-dot"></span>
  </button>

  <aside class="toc-panel" id="toc-panel" aria-label="页面跳转目录">
    <div class="toc-head">
      <div class="toc-head-text">
        <strong id="toc-title">银河目录</strong>
        <small id="toc-subtitle">随时跳转到任何版块</small>
      </div>
      <button class="toc-close" id="toc-close" type="button" aria-label="关闭银河目录">×</button>
    </div>
    <!-- 各版块跳转按钮：天体图标直接作为每个目录项的前缀，由 config.js 渲染 -->
    <nav class="toc-links" id="toc-links" aria-label="版块目录"></nav>
  </aside>

  <main>
    <!-- ================================================================
         首屏 Hero：左侧自我介绍 + 右侧贪吃蛇装饰
         背景：夜空星光（three-bg.js 绘制，星星会跟随鼠标/地球光标移动）
         ================================================================ -->
    <section class="hero" id="home">
      <!-- 首屏光影装饰层：光斑/光束/光尘/流星（星空 canvas 已移到全站 #star-field 层） -->
      <div class="hero-bg" id="hero-bg" aria-hidden="true">
        <!-- 动态光影层：大光斑 + 光束 + 光尘，营造空气感（CSS 动画） -->
        <div class="light-orb orb-1"></div>
        <div class="light-orb orb-2"></div>
        <div class="light-orb orb-3"></div>
        <div class="light-beam beam-1"></div>
        <div class="light-beam beam-2"></div>
        <div class="light-dust" style="--x:12%;--y:18%;"></div>
        <div class="light-dust" style="--x:78%;--y:26%;"></div>
        <div class="light-dust" style="--x:64%;--y:76%;"></div>
        <div class="light-dust" style="--x:22%;--y:72%;"></div>
        <!-- 流星：不定时划过夜空 -->
        <span class="shooting-star shooting-1"></span>
        <span class="shooting-star shooting-2"></span>
      </div>

      <div class="container hero-inner">
        <!-- 左侧：文字介绍（由 config.js 渲染） -->
        <div class="hero-left" id="hero-left"></div>

        <!-- 右侧：贪吃蛇装饰卡片（游戏画布与按钮由 main.js 创建） -->
        <div class="hero-right" id="hero-right"></div>
      </div>

      <!-- 向下滚动提示箭头 -->
      <a class="scroll-hint" href="#about" aria-label="向下滚动查看更多">
        <span class="mouse"><span class="wheel"></span></span>
        <span class="scroll-text">向下滚动</span>
      </a>
    </section>

    <!-- ================================================================
         关于我：个人简介 + 基本信息
         ================================================================ -->
    <section class="section" id="about">
      <div class="container">
        <div class="section-head" data-head="about"></div>
        <div class="about-body" id="about-body"></div>
      </div>
    </section>

    <!-- ================================================================
         掌握技能：分组技能卡片 + 熟练度进度条
         ================================================================ -->
    <section class="section section-alt" id="skills">
      <div class="container">
        <div class="section-head" data-head="skills"></div>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <!-- ================================================================
         参加比赛及获奖情况：奖状墙（位于学习经历之前）
         ================================================================ -->
    <section class="section" id="awards">
      <div class="container">
        <div class="section-head" data-head="awards"></div>
        <div class="awards-wall" id="awards-grid"></div>
      </div>
    </section>

    <!-- ================================================================
         项目成果展示及资料：分类筛选 + 项目卡片网格
         （位于奖项与学习经历之间）
         ================================================================ -->
    <section class="section section-alt" id="projects">
      <div class="container">
        <div class="section-head" data-head="projects"></div>
        <div class="filter-bar" id="project-filters" role="tablist" aria-label="项目分类筛选"></div>
        <div class="project-grid" id="project-grid"></div>
      </div>
    </section>

    <!-- ================================================================
         学习经历：大日记本
         ================================================================ -->
    <section class="section" id="research">
      <div class="container">
        <div class="section-head" data-head="research"></div>
        <div class="timeline" id="research-list"></div>
      </div>
    </section>

    <!-- ================================================================
         我的笔记：笔记卡片
         ================================================================ -->
    <section class="section section-alt" id="notes">
      <div class="container">
        <div class="section-head" data-head="notes"></div>
        <div class="notes-grid" id="notes-grid"></div>
      </div>
    </section>

    <!-- ================================================================
         光影瞬间：照片墙 / 头像更多展示位（点击可放大查看）
         ================================================================ -->
    <section class="section" id="gallery">
      <div class="container">
        <div class="section-head" data-head="gallery"></div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>

    <!-- ================================================================
         联系我：社交链接卡片
         ================================================================ -->
    <section class="section section-alt" id="contact">
      <div class="container">
        <div class="section-head" data-head="contact"></div>
        <div class="contact-grid" id="contact-grid"></div>
      </div>
    </section>
  </main>

  <!-- ================================================================
       页脚：访问量统计 + 版权 + ICP 备案号
       ================================================================ -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="site-stats">
        <span id="busuanzi_container_site_pv" style="display:none;">
          本站总访问量 <span id="busuanzi_value_site_pv">0</span> 次
        </span>
        <span class="stat-divider" aria-hidden="true">·</span>
        <span id="busuanzi_container_site_uv" style="display:none;">
          访客数 <span id="busuanzi_value_site_uv">0</span> 人
        </span>
        <span id="stat-fallback" style="display:none;">访问统计加载中…</span>
      </div>

      <p class="copyright" id="footer-copyright"></p>
      <p class="icp" id="footer-icp"></p>
    </div>
  </footer>

  <!-- 照片灯箱：点击照片后显示大图 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片预览" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览">×</button>
    <button class="lightbox-prev" id="lightbox-prev" type="button" aria-label="上一张">‹</button>
    <figure class="lightbox-body">
      <img id="lightbox-img" src="" alt="" />
      <figcaption>
        <span class="lightbox-title" id="lightbox-title"></span>
        <span class="lightbox-desc" id="lightbox-desc"></span>
      </figcaption>
    </figure>
    <button class="lightbox-next" id="lightbox-next" type="button" aria-label="下一张">›</button>
  </div>

  <!-- 通用媒体全屏预览：日记本里的图片/视频点击后放大查看 -->
  <div class="media-lightbox" id="media-lightbox" role="dialog" aria-modal="true" aria-label="媒体全屏预览" hidden>
    <button class="media-lightbox-close" id="media-lightbox-close" type="button" aria-label="关闭预览">×</button>
    <figure class="media-lightbox-body">
      <img id="media-lightbox-img" src="" alt="" hidden />
      <video id="media-lightbox-video" controls hidden></video>
      <figcaption id="media-lightbox-caption"></figcaption>
    </figure>
  </div>

  <!-- 轻提示气泡：复制邮箱/QQ 成功后显示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Steam 风格成就弹出区：贪吃蛇达到死亡次数成就时显示 -->
  <div class="achievement-box" id="achievement-box" aria-live="polite"></div>

  <!-- 回到顶部悬浮按钮 -->
  <button class="back-top" id="back-top" type="button" aria-label="回到顶部">↑</button>

  <!-- ================================================================
       地球鼠标：进入网站后替换默认鼠标，地球会持续自转，
       星空的视角会跟随这颗“地球”的移动而变化（触屏设备自动隐藏）
       ================================================================ -->
  <div class="earth-cursor" id="earth-cursor" aria-hidden="true">
    <span class="earth-cursor-spin">🌍</span>
    <span class="earth-cursor-orbit"></span>
    <span class="earth-cursor-glow"></span>
  </div>

  <!-- ================================================================
       脚本加载顺序（重要，不要改变顺序）：
       1. Three.js CDN：为粒子背景提供 3D 能力（加载失败会自动降级为 2D 星空）
       2. config.js：全站内容配置
       3. three-bg.js：夜空星光背景（鼠标追踪）
       4. main.js：页面渲染与全部交互逻辑
       ================================================================ -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script defer src="js/config.js?v=20250206-award"></script>
  <script defer src="js/three-bg.js?v=20250206"></script>
  <script defer src="js/sky-scene.js?v=20250206"></script>
  <script defer src="js/main.js?v=20250206-award"></script>

  <!-- 不蒜子访问量统计脚本（在 config.js 中把 statsEnabled 设为 false 可不显示） -->
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
